<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Reset password · Televo</title>
<style>
  :root { --bg:#15121C; --card:#1C1825; --line:#2F2939; --text:#F4EFE9; --dim:#A9A0AB; --accent:#E8A487; --ink:#1A1414; --bad:#E0806F; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 26px; text-align:center; }
  .mark { width:52px; height:52px; border-radius:15px; background:var(--accent); display:grid; place-items:center; margin:0 auto 18px; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { color:var(--dim); margin:0 0 14px; }
  .btn { display:block; width:100%; padding:15px 18px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:700; font-size:16px; text-decoration:none; border:0; cursor:pointer; margin-top:8px; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .err { color:var(--bad); }
  .small { font-size:13.5px; margin-top:18px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A1414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <a class="btn" id="open" href="#" hidden></a>
  <div id="get" hidden>
    <a class="btn ghost" id="ios" href="https://testflight.apple.com/join/yxDepS3N"></a>
    <a class="btn ghost" id="android" href="https://gettelevo.space/#download"></a>
  </div>
  <p class="small" id="note"></p>
</main>
<script>
(function () {
  var KIND = 'reset';
  var ru = (navigator.language || '').toLowerCase().indexOf('ru') === 0;
  var T = ru ? {
    reset: ['Сброс пароля', 'Открываем Televo, чтобы вы задали новый пароль.'],
    confirm: ['Подтверждение почты', 'Открываем Televo, чтобы завершить вход.'],
    open: 'Открыть Televo', ios: 'Установить на iPhone', android: 'Скачать для Android',
    note: 'Ничего не произошло? Нажмите «Открыть Televo». Если приложения нет, установите его и откройте ссылку из письма ещё раз.',
    desktop: 'Откройте эту ссылку из письма на телефоне, где установлен Televo.',
    expired: ['Ссылка устарела', 'Эта ссылка уже использована или истекла. Запросите новое письмо в приложении Televo.'],
    empty: ['Ссылка неполная', 'Откройте ссылку прямо из письма, целиком.']
  } : {
    reset: ['Reset your password', 'Opening Televo so you can set a new password.'],
    confirm: ['Confirm your email', 'Opening Televo to finish signing in.'],
    open: 'Open Televo', ios: 'Install on iPhone', android: 'Download for Android',
    note: 'Nothing happened? Tap "Open Televo". If you don’t have the app, install it and open the link from the email again.',
    desktop: 'Open this link from the email on the phone where Televo is installed.',
    expired: ['This link has expired', 'It was already used or is too old. Request a new email in the Televo app.'],
    empty: ['This link is incomplete', 'Open the link straight from the email, in full.']
  };
  var $ = function (id) { return document.getElementById(id); };
  // Tokens arrive after # (or ?). Keep them in memory only and clear the
  // address bar right away so they don't stay in browser history.
  var raw = location.hash.length > 1 ? location.hash.slice(1) : location.search.slice(1);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var params = new URLSearchParams(raw);
  var path = KIND === 'reset' ? 'reset-password' : 'confirm';

  if (params.get('error_description') || params.get('error')) {
    $('h').textContent = T.expired[0]; $('p').textContent = T.expired[1]; $('p').className = 'err';
    return;
  }
  if (!raw) {
    $('h').textContent = T.empty[0]; $('p').textContent = T.empty[1];
    return;
  }
  $('h').textContent = T[KIND][0]; $('p').textContent = T[KIND][1];

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!isAndroid && !isIOS) { $('p').textContent = T.desktop; return; }

  // Android: an intent URL pinned to our package, so no other app that
  // claims the televo:// scheme can receive the tokens.
  var target = isAndroid
    ? 'intent://auth/' + path + '?' + raw + '#Intent;scheme=televo;package=com.televo.app;end'
    : 'televo://auth/' + path + '?' + raw;
  var open = $('open');
  open.textContent = T.open; open.href = target; open.hidden = false;
  $('ios').textContent = T.ios; $('android').textContent = T.android;
  $('ios').hidden = !isIOS; $('android').hidden = !isAndroid;
  $('get').hidden = false;
  $('note').textContent = T.note;
  setTimeout(function () { location.href = target; }, 300);
})();
</script>
</body>
</html>
